<body style="margin:0;padding:0;background:#EEF2F6;">
<div style="background:#EEF2F6;padding:32px 16px;">

      <table role="presentation" cellpadding="0" cellspacing="0"><tr>

        <td style="vertical-align:middle;padding-left:10px;font-size:17px;font-weight:800;color:#0F172A;">Flow<span style="color:#FF0055;">.</span></td>
      </tr></table>
    </td></tr>

        <tr><td style="padding:0 0 16px;"><img src="https://flow.zutra.cl/email/icon-reauth.png" width="48" height="48" alt="" style="display:block;border:0;"></td></tr>
        <tr><td style="padding:0 0 10px;font-size:21px;line-height:1.25;font-weight:800;color:#0F172A;">Confirma que eres tú</td></tr>
        <tr><td style="padding:0 0 18px;font-size:14.5px;line-height:1.6;color:#334155;">Para continuar con este cambio en <strong>Flow</strong>, ingresa este código de verificación:</td></tr>
        <tr><td style="padding:4px 0 0;"><div style="display:inline-block;background:#FFF1F5;border:1px solid #FFD9E6;border-radius:10px;padding:14px 26px;font-size:28px;font-weight:800;letter-spacing:6px;color:#D6004C;">{{ .Token }}</div></td></tr>
      </table>
    </td></tr>
    <tr><td style="padding:14px 28px;border-top:1px solid #E2E8F0;background:#FAFBFC;font-size:11.5px;line-height:1.5;color:#94A3B8;">
      Si no esperabas este correo, puedes ignorarlo con tranquilidad. · <a href="https://flow.zutra.cl" style="color:#D6004C;text-decoration:none;">Flow</a>
    </td></tr>
